name: check

on:
  push:
  pull_request:

jobs:
  check:
    # One backstop leg, not a matrix. The offline gate (check_all.py
    # --skip-finished + ruff) runs before every commit via
    # tools/hooks/pre-commit, with finished studies (done, retained) exempt;
    # CI runs the full gate so it still catches a hand-flipped manifest.
    # Old-CPython and Windows/macOS coverage now comes from developers
    # running the same gate on their own machines. The 105s deterministic
    # reproduction (SSWA_REPRODUCE=1, tests/test_dossier_example.py) is
    # manual-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the artifacts gate resolves each cleaned study's
          # archive record, and pre-archive records point at a git commit that
          # a shallow (depth 1) checkout drops.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repo-wide gate
        run: python tools/check_all.py
      - name: Lint the repo's own Python
        run: python -m ruff check tools tests
