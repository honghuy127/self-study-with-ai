name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the artifacts gate resolves each cleaned study's
          # archive.yaml git_commit, which a shallow (depth 1) checkout drops.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Run repo-wide gate
        run: python tools/check_all.py
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
