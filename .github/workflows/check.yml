name: check

on:
  push:
  pull_request:

jobs:
  check:
    # Windows is a first-class target: the repo's own author works there, and
    # the suite used to fail on it (POSIX-only test environments, path
    # separators in assertions, shell build scripts).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: the artifacts gate resolves each cleaned study's
          # archive record, and pre-archive records point at a git commit that
          # a shallow (depth 1) checkout drops.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repo-wide gate
        run: python tools/check_all.py
      - name: Lint the repo's own Python
        run: python -m ruff check tools tests
      # About 105 seconds, so it runs once rather than on every matrix leg.
      # The cheap hash check in the same file runs everywhere.
      - name: Verify the recorded experiment still reproduces byte for byte
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        env:
          SSWA_REPRODUCE: "1"
        run: >-
          python -m unittest
          tests.test_dossier_example.AuditedExampleTests.test_experiment_is_deterministic_from_its_seed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
