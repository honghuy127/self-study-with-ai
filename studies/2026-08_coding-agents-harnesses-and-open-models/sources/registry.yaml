# sources/registry.yaml for the combined study
# 2026-08_coding-agents-harnesses-and-open-models. Merged 2026-08-20 from
# studies/2026-08_coding-agent-harnesses and studies/2026-08_open-source-model-compat.
# Schema per AGENTS.md Contracts: key, title, authors, year, url, pdf, venue,
# tier (peer-reviewed | preprint | blog | codebase | docs), status
# (to-read | noted | rejected), notes_file. Codebase entries add repo (key in
# sources/repos.yaml) and component (directories/files covered). Docs/blog
# entries add snapshot under sources/docs/.
#
# Merge notes:
# - Entry keys from both studies were disjoint; all 44 entries carried over.
# - The harness registry stored notes_file values as \"notes/...\", a quoting
#   bug; values are normalized to plain quotes here.
# - Harness doc snapshots lived under its sources/docs/ and were dropped at
#   done-time cleanup; their snapshot paths are historical (recover from the
#   harness study's git history). Compat snapshots moved here unchanged.

provenance:
  research_questions:
    # Part I (harness architecture, from 2026-08_coding-agent-harnesses)
    - "RQ1 (primary, Part I): How do Claude Code, Codex, and OpenCode implement their coding-agent harnesses, and where do they genuinely differ?"
    - "RQ2 (Part I): What components make up a coding-agent harness in general (turn loop, tools, context management, permissions, extensibility)?"
    - "RQ3 (Part I): How does each system trade capability against safety in shell and file access?"
    - "RQ4 (Part I): What does Claude Code's closed core reveal through its docs, plugin surface, and third-party teardowns?"
    # Part II (open-source model support, from 2026-08_open-source-model-compat)
    - "RQ5 (primary, Part II): How compatible are Claude Code, Codex, and OpenCode with open-source models, and through which integration surface (native provider code, generic OpenAI-compatible endpoint, or documentation only)?"
    - "RQ6 (Part II): What minimum contract must an OpenAI-compatible server satisfy for each agent (wire API shape, tool calling, context-window reporting, streaming)?"
    - "RQ7 (Part II): Where does support degrade with open models: model-ID-gated features, context accounting defaults, compaction behavior?"
  review_mode: "Orientation scan plus component inventory. Not a systematic review; coverage is scoped and dated, never exhaustive."
  evidence_cutoff: "2026-08-20"
  scope:
    - "Primary code: three pinned local checkouts recorded in sources/repos.yaml (claude-code @ c3d2e35, codex @ af70018, opencode @ d545d8fb). Part I covers eight dimensions: turn loop; context/compaction; tools & apply-patch; permissions/sandboxing; extensibility (MCP/plugins/hooks/subagents/skills); config/providers; state/rollout/session persistence; interfaces (TUI/ACP/LSP). Part II adds provider plumbing components for Ollama, LM Studio, and generic OpenAI-compatible endpoints."
    - "Official docs for all three systems, one entry per docs area relevant to the dimensions, plus the open-model wiring docs (Claude Code model configuration and Bedrock)."
    - "Server-side contract docs for Part II: Ollama OpenAI compatibility, LM Studio local server and OpenAI-compatible endpoints, llama.cpp reference server."
    - "Framing preprints: ReAct, SWE-agent/SWE-bench, Toolformer."
    - "Third-party Claude Code teardowns, tier: blog, max 3, usable only for hedged contextual claims. One blog-tier community router for Claude Code, context only, hedged."
  queries:
    - date: "2026-08-19"
      query: "Repo pinning (pre-established): tools/pin_repos.py pinned claude-code, codex, opencode clones; EVD-001..EVD-003 (harness study)."
    - date: "2026-08-20"
      query: "Local checkout inventory (artifact-checked): git log -1 on each clone confirmed pinned commits and clean trees; ls/glob over codex-rs/ crates, codex-rs/core/src/, packages/opencode/src/, packages/*, claude-code plugins//examples//scripts//Script/. Every component path below verified to exist at the pinned commit."
    - date: "2026-08-20"
      query: "arXiv abs pages 2210.03629, 2405.15793, 2302.04761 (webfetch). Exact titles, authors, versions, DataCite DOIs recorded from the canonical pages; abstracts checked. PDFs downloaded to sources/pdfs/."
    - date: "2026-08-20"
      query: "Decision: do not commit the local PDF binaries. The framing-preprint entries now carry the canonical arXiv PDF URL in the `pdf` field, and the local evidence artifact is the pdftotext snapshot in sources/docs/ (cited by `snapshot`). The previously downloaded PDFs under sources/pdfs/ were removed from the working tree."
    - date: "2026-08-20"
      query: "Official docs verification (webfetch/curl): github.com/openai/codex/tree/main/docs (directory listing matches pinned docs/); developers.openai.com/codex/cli and /codex/sandboxing; opencode.ai/docs; docs.claude.com/en/docs/claude-code/{hooks,sub-agents,plugins,mcp,memory} (each 200, redirects to code.claude.com/docs/en/<slug>); code.claude.com/docs/en/{permissions,settings,sandboxing} (.md endpoints fetched)."
    - date: "2026-08-20"
      query: "Web search for Claude Code teardowns: DuckDuckGo HTML '\"claude code\" internals reverse engineering system prompt teardown'; follow-ups: minusx.ai blog page, github.com/wtfwhs/tengu-decoded README (raw.githubusercontent), agiflow.io blog page, simonwillison.net search (chat-prompt posts, excluded), kotrotsos.medium.com (403, excluded)."
    - date: "2026-08-20"
      query: "Repo re-pinning for Part II: tools/pin_repos.py re-pinned codex, opencode, claude-code checkouts, confirming the same commits (af70018, d545d8fb, c3d2e35)."
    - date: "2026-08-20"
      query: "Part II doc snapshots (curl, HTTP 200 unless noted): code.claude.com/docs/en/model-config.md and /amazon-bedrock.md (.md endpoints); ollama.com/blog/openai-compatibility (HTML); github.com/lmstudio-ai/docs raw files at main (server index, openai-compat chat-completions/tools/responses); github.com/ggml-org/llama.cpp master tools/server/README.md raw; github.com/musistudio/claude-code-router main README.md raw. LM Studio docs site (docs.lmstudio.ai) unreachable from this environment (transport error), mirrored via its public docs repo. vLLM's OpenAI-compatible-server docs page moved and could not be re-located within budget; dropped, coverage limit recorded."
  inclusion:
    - "Codebase components at component granularity; every listed path verified present at the pinned commit."
    - "Two extra codebase entries added beyond the candidate list to cover the config/providers dimension: codex-config-providers and opencode-config-providers. opencode-permissions additionally folds in packages/codemode (confined interpreter) and worktree sandboxes because that is where the pinned tree implements its isolation."
    - "Part II codebase components verified to exist at the pinned commits (grep before registration): codex-rs/ollama, codex-rs/lmstudio, codex-rs/model-provider-info; opencode src/provider/provider.ts, src/provider/transform.ts, src/tool/registry.ts, src/util/token.ts."
    - "Docs entries limited to harness-relevant areas (Part I) and the compatibility surface (Part II: server contract, OpenAI-compatible endpoints, Claude Code model wiring)."
    - "Three blog-tier teardowns restricted to analysis of publicly distributed artifacts or intercepted network traffic; each may only support hedged contextual claims about the closed core. claude-code-router admitted only as hedged community context for RQ5's Claude Code column; never carries a compatibility cell alone."
  exclusion:
    - "Teardowns built on the reported 2026-03-31 Claude Code source-map leak (github.com/anderson2805/claude-code-internals; victorantos.com 'Claude Code Internals' post; ai.plainenglish.io leak write-up): excluded as leaked-source material, not a permitted surface under the human-approved decision; the brief restricts claims to verifiable artifacts."
    - "kotrotsos.medium.com 'Claude Code Internals' 15-part series: found via search snippet but the page returns 403 to both curl and webfetch; not verifiable against the canonical page, excluded."
    - "cc.deeptoai.com Claude Code reverse-analysis guide: unclear provenance and authorship, excluded."
    - "Simon Willison's system-prompt posts: concern Claude chat system prompts, not Claude Code harness machinery; out of RQ scope, excluded (tag page logged in queries)."
    - "LLM capability benchmarks and model comparisons beyond the three framing preprints: out of scope per brief."
    - "OpenAI API/product docs beyond the Codex CLI surface (Responses API, Agents SDK): out of scope; pages seen while verifying the Codex docs site were not registered."
    - "vLLM docs: page relocated and new slug not recovered within budget; generic-endpoint bar carried by llama.cpp and LM Studio instead."
    - "llama.cpp and vLLM codebases: out of scope; the agents under study are the compatibility subject, not the servers."
    - "Any behavioral test: no agent executed, no model API called (brief decision)."
    - "Model quality comparisons, fine-tuning guidance, benchmark numbers."
  ranking_rationale: >
    Ranked against RQ1-RQ7. The 17 Part I codebase entries are primary
    evidence for RQ1-RQ3 (the only inspectable harness machinery) and are
    ordered so each of the eight brief dimensions is covered per open
    system. The three Part II codebase entries are primary evidence for
    RQ5-RQ7. The docs entries are primary evidence for RQ4 (Claude Code),
    RQ6 (server contract), and secondary corroboration for Codex/OpenCode
    behavior. The 3 preprints frame RQ2 (what a coding agent is:
    interleaved reasoning/acting, agent-computer interfaces, tool
    calling). The 3 teardowns and the community router are context only
    and never bear strong claims.
  coverage_limits:
    - "[CLOSED] Claude Code core: turn loop, tool implementations, context compaction engine, session/rollout storage, and permission enforcement code are closed source. No codebase entries exist for these dimensions of claude-code; they are covered only by official docs, the plugin/example surface (claudeCodePluginSurface), and hedged blog-tier teardowns."
    - "opencode permissions/sandboxing: the pinned tree contains no OS-level sandbox (no seatbelt/bubblewrap/landlock machinery found within searched scope). Isolation surface is: permission rulesets (packages/opencode/src/permission), git-worktree sandbox workspaces (packages/opencode/src/worktree, packages/schema/src/project.ts), and the confined codemode interpreter (packages/codemode). Recorded in the opencode-permissions component note."
    - "Docs sites are not pinned: opencode.ai/docs and code.claude.com/docs reflect current versions (checked 2026-08-19/2026-08-20) and can drift from the pinned commits. Codex docs-site content (e.g., hooks) may describe features newer than pinned checkout af70018; docs-site claims must cite the page, and code claims must cite the pinned tree. The codex docs/ directory exists in the pinned checkout too, so its files can be cited at commit af70018."
    - "Teardown search was a single query family on one engine plus known-candidate checks; additional teardowns may exist and are not claimed to be covered."
    - "opencode checkout is the dev branch of anomalyco/opencode (TypeScript rewrite); older Go-era opencode architecture is out of scope."
    - "[CLOSED] Claude Code's model wiring beyond docs: loader and fallback logic are not inspectable; Part II cells are documentation-attested or surface-attested."
    - "LM Studio snapshots come from the docs-repo mirror at main HEAD on 2026-08-20, not the live docs site (unreachable here); drift between mirror and shipped app is not assessed."
    - "Ollama snapshot is the 2024 OpenAI-compatibility blog post; versioned Ollama behavior (current release notes) is not snapshot-pinned."
    - "Harness-study (Claude Code docs, teardown) snapshot paths are historical after that study's done-time cleanup; local copies live in its git history."
    - "Findings are bounded to the three pinned commits and the fetch-date snapshots; nothing generalizes to newer releases."

