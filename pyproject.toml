[project]
name = "self-study-with-ai"
version = "0.2.0"
description = "Structured, auditable self-study with AI agents: gated study lifecycles, an anchored evidence chain, and a knowledge base with spaced review."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

# The tools are run as scripts (python3 tools/<name>.py), not installed as a
# package. This file exists to declare the dependency and to configure the
# linter in one place.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tools/research"]  # vendored upstream; see tools/research/UPSTREAM.md

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are checked by review, not mechanically
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests insert tools/ on sys.path before importing
"tools/*" = ["E402"]  # same pattern for cross-tool imports
