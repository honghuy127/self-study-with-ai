    - text: "transformer attention scaling factor justification"
      date: "2026-08-04"
      scope: "arXiv"
  knowledge_reused: []   # first study in this base; nothing to reuse
  inclusion: >-
    The question is about a specific choice made in one paper, so the primary
    source is the paper that made it. Secondary explanations were excluded on
    purpose: they restate the same footnote with less precision, and citing
    them would launder a primary claim through a blog.
  coverage_limits: >-
    One source. This is not a survey of attention scaling and says nothing
    about later alternatives. Claims about what happens empirically at large
    d_k come from the source's own reporting, not from any run in this study.

